<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  .wrap{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    perspective:800px;
    pointer-events:none;
  }
  .stage{
    position:relative;
    width:90%;max-width:600px;
    text-align:center;
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform .3s ease;
  }
  .lyric-line{
    font-family:"Noto Sans SC","PingFang SC",sans-serif;
    font-size:clamp(18px,4.5vw,28px);
    font-weight:900;
    letter-spacing:1px;
    line-height:1.4;
    color:#fff;
    text-shadow:
      0 0 8px var(--glow-color, rgba(156,255,223,.6)),
      0 0 20px var(--glow-color, rgba(156,255,223,.3)),
      0 2px 4px rgba(0,0,0,.8);
    opacity:0;
    transform:translateY(20px) translateZ(-30px);
    transition:opacity .4s ease, transform .5s ease;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
  }
  .lyric-line.visible{
    opacity:1;
    transform:translateY(0) translateZ(0);
  }
  .lyric-line.beat{
    text-shadow:
      0 0 12px var(--glow-color, rgba(156,255,223,.9)),
      0 0 30px var(--glow-color, rgba(156,255,223,.5)),
      0 0 50px var(--glow-color, rgba(156,255,223,.2)),
      0 2px 4px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="lyric-line" id="lyric"></div>
  </div>
</div>
<script>
  var stage = document.getElementById('stage');
  var lyricEl = document.getElementById('lyric');
  var state = { playing:false, text:'', color:'#9cffdf' };
  var tiltX = 0, tiltY = 0, beatTimer = 0;

  function applyState(next) {
    state = Object.assign({}, state, next || {});
    document.documentElement.style.setProperty('--glow-color', hexToRgba(state.color, 0.5));

    if (next.text !== undefined) {
      lyricEl.classList.remove('visible', 'beat');
      setTimeout(function() {
        lyricEl.textContent = state.text || '';
        lyricEl.classList.add('visible');
        if (state.playing) {
          beatTimer = setTimeout(function() {
            lyricEl.classList.add('beat');
            setTimeout(function() { lyricEl.classList.remove('beat'); }, 300);
          }, 100);
        }
      }, 50);
    }
  }

  function hexToRgba(hex, alpha) {
    hex = String(hex || '#9cffdf').trim();
    if (hex.length === 4) hex = '#' + hex[1]+hex[1] + hex[2]+hex[2] + hex[3]+hex[3];
    if (!/^#[0-9a-f]{6}$/i.test(hex)) hex = '#9cffdf';
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return 'rgba('+r+','+g+','+b+','+alpha+')';
  }

  // 3D tilt animation
  function animate() {
    var t = Date.now() * 0.001;
    tiltX = Math.sin(t * 0.4) * 3;
    tiltY = Math.cos(t * 0.3) * 2;
    stage.style.transform = 'rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg)';
    requestAnimationFrame(animate);
  }

  // React Native bridge
  window.addEventListener('message', function(e) {
    try { applyState(JSON.parse(e.data)); } catch(err) {}
  });
  if (window.ReactNativeWebView) {
    window.ReactNativeWebView.postMessage(JSON.stringify({type:'ready'}));
  }

  animate();
</script>
</body>
</html>
